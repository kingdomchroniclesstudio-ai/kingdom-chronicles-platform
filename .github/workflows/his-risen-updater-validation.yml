name: HIS RISEN updater package validation

on:
  push:
    branches:
      - updater-hardening-2026-10-25
      - main
      - updater-final-fixes-2026-10-27
      - controller-maintenance-2026-11-03
  pull_request:
    branches:
      - main
    # CI commits the generated ZIP/checksum back to the PR branch.
    # Ignore those generated artifacts so the bot's own package commit does
    # not request a second workflow approval or create a needless CI loop.
    paths-ignore:
      - "apps/**/*.zip"
      - "apps/**/*.zip.sha256"
      - "apps/controller-package.sha256"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-controller-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the same hardened candidate used by the integration audit
        run: |
          if ! grep -q "HIS RISEN STUDIOS" <(unzip -p "apps/his_risen_controller_ltx25_audited_update_2026-10-10 (2).zip" director_console.py); then
            python scripts/production_readiness_patch.py
            python scripts/combine_recovery_patch.py
            python scripts/production_readiness_followup_patch.py
            python scripts/production_readiness_storage_patch.py
          else
            echo "Branded package already present; skipping original-only patch transforms."
          fi
          python scripts/brand_his_risen_studios.py
          python scripts/studio_control_room_patch.py

      - name: Verify staged archive identity and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          archive="apps/his_risen_controller_ltx25_audited_update_2026-10-10 (2).zip"
          manifest="${archive}.sha256"
          pin_file="apps/controller-package.sha256"
          test -s "$archive"
          test -s "$manifest"
          test -s "$pin_file"
          expected_sha256="$(tr -d '\r\n' < "$pin_file")"
          test -n "$expected_sha256"
          read -r manifest_sha256 manifest_filename < "$manifest"
          test "$manifest_filename" = "$(basename "$archive")"
          test "$manifest_sha256" = "$expected_sha256"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          echo "Archive size: $(stat -c '%s' "$archive") bytes"
          echo "Archive SHA-256: $actual_sha256"
          test "$actual_sha256" = "$expected_sha256"
          unzip -t "$archive"

      - name: Extract package and check expected layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir app
          unzip -q "apps/his_risen_controller_ltx25_audited_update_2026-10-10 (2).zip" -d app
          test -f app/director_console.py
          test -f app/requirements.txt
          test -d app/tests
          test -f app/updates/check.py
          python -m compileall -q app

      - name: Install the same declared Python dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run bundled regression tests
        run: python -m unittest discover -s app/tests -v

      - name: Smoke-test controller startup and health endpoint
        env:
          # Test-only value for this isolated CI runner; never used by Render.
          HRF_DIRECTOR_PIN: "123456"
        shell: bash
        run: |
          set -euo pipefail
          cd app
          python director_console.py --host 127.0.0.1 --port 18765 > "$RUNNER_TEMP/his-risen-console.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error http://127.0.0.1:18765/health; then
              echo
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/his-risen-console.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/his-risen-console.log"
          echo "Health endpoint did not become ready within 25 seconds."
          exit 1

      - name: Probe live updater metadata sources (informational only)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cd app
          timeout 90s python cli.py check-updates

      - name: Verify deployed Render public health and entry page (read-only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://his-risen-director-console.onrender.com"
          health_file="$RUNNER_TEMP/his-risen-live-health.json"
          html_file="$RUNNER_TEMP/his-risen-live-console.html"

          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "$base_url/health" -o "$health_file"
          python - "$health_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          if data.get("ok") is not True or data.get("service") != "HIS RISEN STUDIOS":
              raise SystemExit(f"Unexpected live health response: {data!r}")
          print("Live Render health endpoint: OK")
          PY

          root_status="$(curl --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 5 --max-time 30 --output "$html_file" --write-out '%{http_code}' "$base_url/")"
          case "$root_status" in
            2*) echo "Live console public entry page returned HTTP $root_status." ;;
            *) echo "Live console entry page returned unexpected HTTP $root_status." >&2; exit 1 ;;
          esac
          python - "$html_file" <<'PY'
          import pathlib, sys
          html = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          print(f"Updater label appears on public entry page: {'LTX Update Monitor' in html}")
          print(f"Update action appears on public entry page: {'Check for Updates' in html}")
          if "LTX Update Monitor" not in html or "Check for Updates" not in html:
              print("This can be normal when the controls are shown only after sign-in; verify the controls in the authenticated UI.")
          PY


      - name: Commit the validated deployable package to the PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          archive="apps/his_risen_controller_ltx25_audited_update_2026-10-10 (2).zip"
          manifest="${archive}.sha256"
          pin_file="apps/controller-package.sha256"
          staged="$RUNNER_TEMP/hrf-validated-package"
          mkdir -p "$staged"
          cp "$archive" "$manifest" "$pin_file" "$staged/"
          git fetch origin "$GITHUB_HEAD_REF"
          # Build/test steps modified the generated ZIP, manifest and checksum pin.
          # They are safely staged outside the repository above; clean the temporary
          # merge-checkout before switching to the PR head branch.
          git reset --hard HEAD
          git clean -fd
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp "$staged/$(basename "$archive")" "$archive"
          cp "$staged/$(basename "$manifest")" "$manifest"
          cp "$staged/$(basename "$pin_file")" "$pin_file"
          git add "$archive" "$manifest" "$pin_file"
          if git diff --cached --quiet; then
            echo "Validated controller package is already committed on the PR branch."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update validated HIS RISEN controller package"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
