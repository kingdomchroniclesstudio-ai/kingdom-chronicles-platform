name: HIS RISEN LTX scheduled update discovery

on:
  schedule:
    # Hourly wake-up keeps the interval configurable (default six hours).
    # The script skips checks until the configured interval is due.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      interval_hours:
        description: Monitoring interval for this manual run
        required: false
        type: choice
        options:
          - "1"
          - "3"
          - "6"
          - "12"
          - "24"
        default: "6"

permissions:
  contents: write

concurrency:
  group: hrf-ltx-update-state
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source branch
        uses: actions/checkout@v7
        with:
          ref: main
          path: source

      - name: Check out persistent update-state branch
        uses: actions/checkout@v7
        with:
          ref: ltx-update-state
          path: state
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run scheduled monitor mock regression tests
        run: python -m unittest discover -s source/tests -p "test_ltx_update_scheduler.py" -v

      - name: Run official-source metadata discovery
        env:
          SCHEDULE_INTERVAL: ${{ inputs.interval_hours || vars.LTX_UPDATE_INTERVAL_HOURS || '6' }}
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_CHECK" == "true" ]]; then
            python source/scripts/ltx_update_scheduled_check.py --state-file state/state/ltx_update_manager.json --inventory-file state/state/ltx_environment_inventory.json --interval-hours "$SCHEDULE_INTERVAL" --force
          else
            python source/scripts/ltx_update_scheduled_check.py --state-file state/state/ltx_update_manager.json --inventory-file state/state/ltx_environment_inventory.json --interval-hours "$SCHEDULE_INTERVAL"
          fi

      - name: Persist update history and notifications
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ltx_update_manager.json
          if git diff --cached --quiet; then
            echo "No state changes to persist."
          else
            git commit -m "Record scheduled LTX ecosystem update check"
            git push origin HEAD:ltx-update-state
          fi
