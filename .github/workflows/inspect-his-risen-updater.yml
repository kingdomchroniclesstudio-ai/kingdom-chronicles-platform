name: Inspect HIS RISEN updater source
on:
  push:
    branches:
      - updater-final-fixes-2026-10-27
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract staged controller package
        run: |
          set -euo pipefail
          unzip -q "apps/his_risen_controller_ltx25_audited_update_2026-10-10 (2).zip" -d app
          echo "=== updater source files ==="
          find app/updates -maxdepth 2 -type f -print
          echo "=== updates/check.py ==="
          sed -n '1,280p' app/updates/check.py
          echo "=== baseline / rate-limit references ==="
          grep -RniE 'baseline|rate limit|403|github_releases|huggingface|model_revision|manual review' app/updates app/tests app/*.py | head -n 220 || true
          echo "=== updater related tests ==="
          for f in app/tests/*update* app/tests/*metadata*; do
            if [ -f "$f" ]; then echo "--- $f"; sed -n '1,260p' "$f"; fi
          done
